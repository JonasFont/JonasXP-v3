<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JonasXP - Área do Aluno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: system-ui, sans-serif; }
        .card-custom { background-color: #111827; border: 1px solid #1f2937; border-radius: 12px; }
        .grad-text { background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="py-4">

    <div class="container" style="max-width: 800px;">
        <!-- CABEÇALHO DO ALUNO -->
        <div class="card card-custom p-4 mb-4 text-center">
            <h2 id="alunoNome" class="fw-bold grad-text mb-1">Carregando...</h2>
            <span id="alunoTurma" class="badge bg-secondary align-self-center mb-3">--</span>

            <div class="row g-3 text-center my-2">
                <div class="col-4">
                    <div class="p-2 bg-black bg-opacity-50 rounded">
                        <small class="text-muted d-block">NÍVEL</small>
                        <h3 id="alunoNivel" class="text-primary mb-0">--</h3>
                    </div>
                </div>
                <div class="col-4">
                    <div class="p-2 bg-black bg-opacity-50 rounded">
                        <small class="text-muted d-block">TÍTULO</small>
                        <span id="alunoTitulo" class="fw-bold text-warning small mt-2 d-block">--</span>
                    </div>
                </div>
                <div class="col-4">
                    <div class="p-2 bg-black bg-opacity-50 rounded">
                        <small class="text-muted d-block">TOTAL XP</small>
                        <h3 id="alunoXP" class="text-success mb-0">--</h3>
                    </div>
                </div>
            </div>

            <!-- BARRA DE PROGRESSO -->
            <div class="progress mt-3 bg-dark" style="height: 12px;">
                <div id="alunoProgresso" class="progress-bar progress-bar-striped progress-bar-animated bg-warning" style="width: 0%"></div>
            </div>
        </div>

        <!-- HISTÓRICO DE LANÇAMENTOS -->
        <div class="card card-custom p-4">
            <h5 class="fw-bold mb-3"><i class="fa-solid fa-clock-rotate-left me-2"></i>Histórico de Conquistas</h5>
            <div class="table-responsive">
                <table class="table table-dark align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Atv</th>
                            <th>Eqp</th>
                            <th>Comp</th>
                            <th>Part</th>
                            <th>Total</th>
                            <th>Obs</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaHistoricoAluno">
                        <tr>
                            <td colspan="7" class="text-center py-4 text-muted">Carregando...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- CARREGAMENTO DE SCRIPTS EM ORDEM -->
    <script src="js/api.js"></script>
    <script src="js/aluno.js"></script>
</body>
</html>
