<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JonasXP - Perfil do Herói</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="py-4">
  <div class="container max-width-sm">
    <div id="loading" class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-2">Carregando dados do Herói...</p>
    </div>

    <div id="perfilContent" class="d-none">
      <!-- Card Perfil Principal -->
      <div class="rpg-card p-4 text-center mb-4">
        <h1 id="alunoNome" class="fw-bold mb-1">---</h1>
        <p id="alunoTurma" class="text-muted mb-3">---</p>
        
        <div class="d-flex justify-content-center gap-2 mb-3">
          <span id="alunoNivel" class="badge badge-rpg">Nível 1</span>
          <span id="alunoTitulo" class="badge bg-secondary">Novato</span>
        </div>

        <div class="my-3">
          <div class="d-flex justify-content-between text-sm mb-1">
            <span>Progresso de XP</span>
            <span id="xpText">0 / 100 XP</span>
          </div>
          <div class="progress">
            <div id="xpBar" class="progress-bar" role="progressbar" style="width: 0%"></div>
          </div>
        </div>
      </div>

      <!-- 🏆 Badges / Conquistas Desbloqueáveis -->
      <div class="rpg-card p-4 mb-4">
        <h5 class="mb-3">🏆 Badges Conquistadas</h5>
        <div id="containerBadges" class="d-flex flex-wrap gap-2"></div>
      </div>

      <!-- 🎴 Poderes / Recompensas RPG -->
      <div class="rpg-card p-4 mb-4">
        <h5 class="mb-3">🎴 Poderes RPG Liberados</h5>
        <div id="containerPoderes" class="row g-2"></div>
      </div>

      <!-- Histórico de Aulas -->
      <div class="rpg-card p-4">
        <h5 class="mb-3">📜 Pontuações das Aulas</h5>
        <div id="historico" class="list-group list-group-flush"></div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/aluno.js"></script>
</body>
</html>
